
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

board_microros_distro = jazzy
board_microros_transport = serial

monitor_speed = 115200

lib_deps =
    lib_deps = https://github.com/micro-ROS/micro_ros_arduino.git#jazzy
build_flags =
    -L$PROJECT_DIR/.pio/libdeps/$PIOENV/lib_deps/src/esp32
    -lmicroros